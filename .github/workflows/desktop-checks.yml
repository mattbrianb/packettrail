name: Desktop release checks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Start the local dashboard and read its status
        run: |
          go build -o "$RUNNER_TEMP/packettrail" ./cmd/packettrail
          "$RUNNER_TEMP/packettrail" --headless --demo --port 47819 --data "$RUNNER_TEMP/pt-data" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:47819/api/status | jq -e '.version == "1.5.2"'
